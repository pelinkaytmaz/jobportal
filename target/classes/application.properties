# Nom de l'application
spring.application.name=jobportal

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.xzvlppbqbolixmqlwynm
spring.datasource.password=jobportal12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=POSTGRESQL
spring.jpa.open-in-view=true

# Port du serveur
server.port=8080

# Swagger / OpenAPI
# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.dauphine.jobportal=DEBUG

# JWT
app.jwtSecret=SecretKeyJWT
app.jwtExpirationMs=86400000

# Issuer URL pour Spring Authorization Server
spring.security.oauth2.authorizationserver.issuer-url=http://localhost:8080
spring.datasource.hikari.data-source-properties.prepareThreshold=0
